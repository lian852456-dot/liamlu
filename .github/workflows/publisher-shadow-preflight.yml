name: Publisher shadow preflight

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-publisher-shadow
  cancel-in-progress: false

jobs:
  read-only-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-publisher-shadow
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      PUBLISHER_SHADOW_JOB: ${{ vars.PUBLISHER_SHADOW_JOB }}
    steps:
      - name: Exchange GitHub OIDC for direct federated credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Invoke the immutable read-only shadow job
        run: >-
          gcloud run jobs execute "$PUBLISHER_SHADOW_JOB"
          --project "$GCP_PROJECT_ID"
          --region "$GCP_REGION"
          --wait
