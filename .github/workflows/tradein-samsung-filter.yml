name: Samsung filter acceptance
on:
  pull_request:
    branches: [main, feat/tradein-price-share-20261012]
    paths: ['tradein-price-share.js', 'tradein-brand-query.js', 'tests/tradein-samsung-filter.spec.js', '.github/workflows/tradein-samsung-filter.yml']
  push:
    branches: [main, feat/tradein-price-share-20261012]
    paths: ['tradein-price-share.js', 'tradein-brand-query.js', 'tests/tradein-samsung-filter.spec.js', '.github/workflows/tradein-samsung-filter.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  samsung-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Both source spellings and unchanged quotes (synthetic)
        run: npx playwright test tests/tradein-samsung-filter.spec.js --workers=1 --reporter=list --output=test-results/samsung-synthetic
      - name: Read-only official website acceptance after deployment
        if: github.event_name != 'pull_request'
        env:
          LIVE_SURFACE: ${{ github.ref_name == 'main' && 'internal' || 'public' }}
        run: npx playwright test tests/tradein-samsung-filter.spec.js --grep 'LIVE official' --workers=1 --reporter=list --output=test-results/samsung-live
      - name: Acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: samsung-filter-${{ github.sha }}
          path: test-results/samsung-*/
          retention-days: 7
