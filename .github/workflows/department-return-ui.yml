name: Department return UI checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'department-ops.*'
      - 'department-gold-monthly-ui.js'
      - 'department-scores.js'
      - 'session-read-manager.js'
      - 'portal-logout.js'
      - 'tests/department-*.spec.js'
      - 'tests/session-read-manager.test.cjs'
      - '.github/workflows/department-return-ui.yml'

permissions:
  contents: read

concurrency:
  group: department-return-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  department-return:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - name: Check auth and private read contracts
        run: |
          node --check department-ops.js
          node --test tests/session-read-manager.test.cjs tests/department-ops.test.cjs tests/department-ops-integration.test.cjs tests/department-version-read.test.cjs
      - name: Exercise return and recovery with synthetic data
        env:
          TEST_BASE_URL: http://127.0.0.1:8875/
        run: |
          python3 -m http.server 8875 --bind 127.0.0.1 >/tmp/department-return-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8875/department-ops.html >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/department-fast-read-lifecycle.spec.js tests/department-scores-return-session.spec.js tests/department-scores-denial.spec.js --workers=2 --output=test-results/chromium
          npx playwright test tests/portal-logout.spec.js --grep 'same-tab department password login' --workers=1 --output=test-results/department-logout
          npx playwright test tests/department-display-recovery.spec.js --grep-invert 'readable type at 390' --workers=1 --output=test-results/display
          npx playwright test tests/department-scores-on-demand.spec.js --grep-invert 'at 390' --workers=1 --output=test-results/on-demand
          DEPARTMENT_GOLD_PREVIEW_URL=http://127.0.0.1:8875 npx playwright test tests/department-gold-monthly-ui.spec.js --grep-invert 'phone layout' --workers=1 --output=test-results/gold-write
          node <<'JS'
          const fs=require('node:fs');
          fs.writeFileSync('playwright.department-webkit.cjs',"const base=require('./playwright.config.js');module.exports={...base,use:{...base.use,browserName:'webkit',launchOptions:{}}};\n");
          JS
          npx playwright test tests/department-fast-read-lifecycle.spec.js --config=playwright.department-webkit.cjs --workers=1 --output=test-results/webkit
      - name: Compare existing mobile width failure against the base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          baseline_dir=$(mktemp -d)
          git archive "$BASE_SHA" | tar -x -C "$baseline_dir"
          python3 -m http.server 8876 --bind 127.0.0.1 --directory "$baseline_dir" >/tmp/department-base-server.log 2>&1 &
          base_pid=$!
          python3 -m http.server 8875 --bind 127.0.0.1 >/tmp/department-candidate-server.log 2>&1 &
          candidate_pid=$!
          trap 'kill "$base_pid" "$candidate_pid"' EXIT
          mkdir -p test-results/mobile-width
          TEST_BASE_URL=http://127.0.0.1:8876/ npx playwright test tests/department-display-recovery.spec.js --grep 'readable type at 390' --workers=1 --reporter=json --output=test-results/baseline-mobile >test-results/mobile-width/base.json || true
          TEST_BASE_URL=http://127.0.0.1:8875/ npx playwright test tests/department-display-recovery.spec.js --grep 'readable type at 390' --workers=1 --reporter=json --output=test-results/candidate-mobile >test-results/mobile-width/candidate.json || true
          node <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          function failures(file){
            const report=JSON.parse(fs.readFileSync(file,'utf8')),out=[];
            function walk(s){for(const spec of s.specs||[])for(const t of spec.tests||[])for(const r of t.results||[])if(r.status!=='passed')out.push({title:spec.title,status:r.status,message:r.error?.message});for(const child of s.suites||[])walk(child);}
            walk(report);assert.equal(report.stats.expected+report.stats.unexpected,1);return out;
          }
          const base=failures('test-results/mobile-width/base.json'),candidate=failures('test-results/mobile-width/candidate.json');
          console.log(JSON.stringify({base,candidate},null,2));assert.deepEqual(candidate,base,'Mobile layout differs from the base commit');
          JS
      - name: Save failure details and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: department-return-${{ github.event.pull_request.head.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
