name: QIS personal targets
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/north12b/run_report.py'
      - 'scripts/north12b/extract.py'
      - 'scripts/north12b/qis_personal.py'
      - 'scripts/north12b/build_kpi_report.mjs'
      - 'scripts/north12b/render_xlsx_cjk.py'
      - 'scripts/north12b/verify_artifacts.py'
      - 'tests/test_qis*.py'
      - '.github/workflows/qis-personal.yml'
permissions:
  contents: read
jobs:
  qis-personal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install isolated test dependencies
        run: |
          python3 -m pip install openpyxl==3.1.5 Pillow==11.3.0
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p "$RUNNER_TEMP/qis-fonts"
          ln -s /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc "$RUNNER_TEMP/qis-fonts/NotoSansTC-Regular.ttf"
          ln -s /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc "$RUNNER_TEMP/qis-fonts/NotoSansTC-Bold.ttf"
      - name: Verify all personal target and PNG gates
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          export FONT_DIR="$RUNNER_TEMP/qis-fonts"
          python3 -m unittest discover -s tests -p 'test_qis*.py' -v
          node --check scripts/north12b/build_kpi_report.mjs
