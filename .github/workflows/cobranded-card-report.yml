name: Cobranded card report
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'gas/Code.gs'
      - 'daily-report-layout.js'
      - 'daily-report-summary-*.js'
      - 'tests/cobranded-card-report.*'
      - 'tests/fixtures/report-save-gas.cjs'
      - '.github/workflows/cobranded-card-report.yml'
permissions:
  contents: read
jobs:
  card-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Verify optional count and existing report contracts
        run: node --test tests/cobranded-card-report.test.cjs tests/daily-report-summary-model.test.cjs tests/daily-report-summary-gas.test.cjs tests/report-save-gas.test.cjs tests/report-save-recovery.test.cjs tests/closing-report-completeness.test.cjs tests/gas-date.test.cjs
      - name: Verify desktop and mobile save flows
        env:
          TEST_BASE_URL: http://127.0.0.1:4176/
        run: |
          python3 -m http.server 4176 --bind 127.0.0.1 >/tmp/closing-report-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          npx playwright test tests/cobranded-card-report.spec.js tests/daily-report-summary.spec.js tests/daily-report-save-confirmation.spec.js tests/report-save-recovery.spec.js tests/closing-report-ui.spec.js --workers=1 --reporter=list --output=test-results/card-report
          npx playwright test tests/daily-report-layout.spec.js --grep 'single controls' --workers=1 --reporter=list --output=test-results/card-controls
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: card-report-${{ github.event.pull_request.head.sha }}
          path: test-results/card-*/
          retention-days: 7
