<header><a class="brand" href="/">b. <span>小城造型工作室</span></a><span class="badge">獨立試作</span></header><main><section class="intro"><p class="eyebrow">FOUR LITTLE PERSONALITIES</p><h1>把日常的你，帶進小城。</h1><p>四位照片人偶第一版。拖曳人物旋轉，先確認臉型、髮型與全身造型。</p><p class="note">照片與姓名已依本人提供對照；本頁是造型試作，不連接真人角色、金幣或進度。</p></section>
<nav class="people" aria-label="選擇照片人偶"><button data-person="p1" aria-pressed="true"><strong>袁宇程</strong><small>側分短髮・下巴口罩</small></button><button data-person="p2" aria-pressed="false"><strong>蔡妘㮀</strong><small>齊瀏海・短鮑伯</small></button><button data-person="p3" aria-pressed="false"><strong>鍾嘉玲</strong><small>露額後梳・及肩髮</small></button><button data-person="p4" aria-pressed="false"><strong>莊佩璇</strong><small>側分長髮・米色長褲</small></button></nav>
<section class="workbench"><div class="stage"><div id="canvas-host" aria-label="可旋轉的真實3D照片人偶"></div><div class="stage-label"><strong id="person-label">照片 1</strong><span id="status" role="status">正在準備 3D 人偶…</span></div><p class="drag-hint">拖曳旋轉 · 正面 / 側面 / 背面</p></div><aside class="controls"><div><h2>看一看輪廓</h2><div class="buttons"><button data-view="front" aria-pressed="true">正面</button><button data-view="quarter">45 度</button><button data-view="side">側面</button><button data-view="back">背面</button></div><div class="buttons"><button data-frame="full" aria-pressed="true">全身</button><button data-frame="head">頭部近看</button></div></div><div><h2>試試動作</h2><div class="buttons"><button data-motion="idle" aria-pressed="true">站立</button><button data-motion="walk">走路</button><button data-motion="sit">坐下</button><button data-motion="wave">揮手</button></div></div><div><h2>不同光線</h2><div class="buttons"><button data-light="day" aria-pressed="true">白天</button><button data-light="dusk">傍晚</button><button data-light="night">夜間</button></div></div><a id="try-game" class="primary" href="game.html">帶這位人偶進城試走 →</a><p class="note">城市與森林使用獨立測試存檔。可走路、坐下與換裝，不會覆蓋共用城市。</p></aside></section></main>
