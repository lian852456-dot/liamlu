<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5f0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>北一二B｜金牌管理</title>
  <link rel="stylesheet" href="department-ops.css?v=20260930-1">
</head>
<body>
  <main class="page">
    <a class="back-link" href="home.html">← 返回智慧營運中心</a>
    <header class="masthead"><div><p class="eyebrow">NORTH 12B GOLD</p><h1>北一二B｜金牌管理</h1><p class="lede">查看已確認的每日接龍結算總牌數與跨日增減。</p></div><span id="viewerBadge" class="mode-badge">督導驗證</span></header>
    <section id="loginPanel" class="panel auth-panel">
      <div><p class="step-label">SUPERVISOR ACCESS</p><h2>沿用督導通行碼</h2><p>每日結算確認後由 Codex 同步；可依店點與接龍代稱查詢。</p></div>
      <form id="loginForm" class="auth-form"><label>督導通行碼<input id="passcode" type="password" autocomplete="current-password" required></label><button class="primary-button" type="submit">進入金牌管理</button></form>
      <p id="loginMessage" class="message" aria-live="polite"></p>
    </section>
    <section id="goldViewer" hidden>
      <div class="dashboard-head"><div><p class="step-label">CONFIRMED SETTLEMENT</p><h2>金牌查詢</h2><p id="viewerMeta" class="source-meta"></p></div><button id="logoutButton" class="secondary-button" type="button">登出</button></div>
      <section class="filter-panel"><label>結算日期<select id="viewerMonth"></select></label><label>店點<select id="viewerStore"><option value="">九店全部</option></select></label><label>個人<select id="viewerEmployee"><option value="">全部同仁</option></select></label><label>紀錄起日<input id="viewerDateFrom" type="date"></label></section>
      <div id="viewerSummary" class="summary-grid"></div>
      <section class="data-card"><div class="card-head"><div><h3>個人結算總牌數</h3><p>每個日期是截至當日的總牌數；不同日結不重複加總。</p></div></div><div class="table-scroll"><table><thead id="viewerHead"></thead><tbody id="viewerBody"></tbody></table></div></section>
      <section class="data-card"><div class="card-head"><div><h3>每日增減與原因</h3><p>僅連續兩日皆有確認紀錄時顯示增減；原因與免扣依提供的紀錄呈現。</p></div></div><div class="table-scroll"><table><thead><tr><th>日期</th><th>店點</th><th>同仁</th><th>增減</th><th>原因／免扣</th><th>狀態</th></tr></thead><tbody id="viewerDailyBody"></tbody></table></div></section>
    </section>
  </main>
  <script src="gold-daily-core.js?v=20260930-1"></script>
  <script src="gold-daily-ui.js?v=20260930-1"></script>
  <script src="north12b-gold-ops.js?v=20260930-1" defer></script>
</body>
</html>
