tric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;overflow-wrap:anywhere;word-break:break-word;font-size:14px}.meta .wide{grid-column:span 2}.table-scroll{max-width:100%;overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:9px}table{width:100%;min-width:720px;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:normal}th{color:var(--muted);font-size:12px;background:#f8fbfd;position:sticky;top:0}tr:last-child td{border-bottom:0}.group{margin-top:15px}.group-title,.group-note{overflow-wrap:anywhere;word-break:break-word}.group-title{margin:0;font-size:16px}.group-note{margin:2px 0;color:var(--muted);font-size:12px}.price-list{display:grid;gap:4px;min-width:190px}.price-item{display:flex;justify-content:space-between;gap:10px}.price-item.missing{color:var(--muted)}.price-item.zero strong{color:var(--ok)}.provider{margin-top:14px}.provider h3{margin:0;font-size:15px;overflow-wrap:anywhere;word-break:break-word}.empty{padding:18px;text-align:center;color:var(--muted)}.privacy{margin-top:15px;color:var(--muted);font-size:12px}.change-card{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:11px;background:#fbfdff}.change-counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:9px}.change-count{padding:8px;border-radius:8px;background:#eef6fb}.change-count span{display:block;color:var(--muted);font-size:12px}.change-count strong{display:block;font-size:18px;color:var(--navy)}.change-table{max-width:100%;overflow-x:auto;margin-top:9px;border:1px solid var(--line);border-radius:8px}.change-table table{min-width:860px;margin:0}.change-table .missing{color:var(--muted)}.change-table .zero{color:var(--ok)}@media(max-width:700px){main{width:min(100% - 14px,1180px);margin-top:7px}.hero{padding:18px}.grid,.toolbar{grid-template-columns:1fr}.meta{grid-template-columns:repeat(2,minmax(0,1fr))}.meta .wide{grid-column:auto}.actions button{flex:1 1 auto}.table-scroll{margin-left:-1px;margin-right:-1px}.change-counts{grid-template-columns:repeat(2,minmax(0,1fr))}}

<body>
<main>
  <section class="hero">
    <div class="topbar"><div><h1>手機專案／3C＋舊換新查詢</h1><p>開頁即可查詢最新專案價與舊換新報價</p></div><a class="home-link" href="https://lian852456-dot.github.io/liamlu/home.html">← 智慧營運中心</a></div>
  </section>
  <section class="card" id="queryCard">
    <div class="topbar"><h2 style="margin:0">正式價格查詢</h2><button class="secondary" id="refreshBtn" type="button">重新整理</button></div>
    <div id="queryStatus" class="status" role="status">正在讀取正式價格…</div>
    <div class="tabs" role="tablist"><button class="tab active" id="shoppingTab" data-kind="shopping" type="button" role="tab" aria-selected="true">手機專案／3C</button><button class="tab" id="tradeinTab" data-kind="tradein" type="button" role="tab" aria-selected="false">舊換新</button></div>
    <section id="shoppingPane" data-pane="shopping" role="tabpanel"><div class="toolbar"><label class="field">搜尋品牌／機款／容量／專案條件<input id="shoppingSearch" type="search" autocomplete="off" placeholder="例如：iPhone、256GB、合約"></label><label class="field">選機款（不分顏色）<select id="shoppingModel"><option value="">全部機款</option></select></label></div><div id="shoppingMeta" class="meta"></div><div id="shoppingResults"></div></section>
    <section id="tradeinPane" class="hidden" data-pane="tradein" role="tabpanel"><div class="toolbar"><label class="field">搜尋品牌／機款／容量<input id="tradeinSearch" type="search" autocomplete="off" placeholder="例如：Galaxy、512GB"></label><label class="field">選機款<select id="tradeinModel"><option value="">全部機款</option></select></label></div><div id="tradeinMeta" class="meta"></div><div id="tradeinResults"></div></section>
    <section id="changeCard" class="change-card" aria-live="polite"><h3 id="changeTitle" style="margin:0">本次異動／版本檢查</h3><p id="changeBasis" class="hint">尚未讀取正式異動。</p><div id="changeCounts" class="change-counts"></div><label class="field" style="margin-top:9px">搜尋完整異動條件<input id="changeSearch" type="search" autocomplete="off" placeholder="機款、容量、資費／合約、回收商或等級"></label><p id="changeSummary" class="hint"></p><div id="changeResults" class="change-table"></div><div class="actions"><button class="secondary" id="changePrevBtn" type="button" disabled>上一頁</button><span id="changePage" class="hint" style="align-self:center">第 1 頁</span><button class="secondary" id="changeNextBtn" type="button" disabled>下一頁</button><button class="secondary" id="changeJsonBtn" type="button" disabled>下載完整 JSON</button><button class="secondary" id="changeCsvBtn" type="button" disabled>下載完整 CSV</button></div></section>
    <p class="privacy">免登入即可瀏覽；重新開啟或按「重新整理」會讀取最新正式價格。</p>
  </section>
</main>
<script src="threec-query-core.js?v=20261001-1"></script>
<script src="threec-price-diff-core.js?v=20261001-2"></script>
<script>
(function(scope){
  'use strict';
  const Core=scope.ThreecQueryCore;
  const DiffCore=scope.ThreecPriceDiffCore;
  const API='https://script.google.com/macros/s/AKfycbzkvUUKtaFvEi7gaYWp8M98M_5fAmSD8a7g0ds5WarG5ikiOETTwalHattGKDMfqOfq/exec';
  const state={shopping:null,tradein:null,active:'shopping',loading:false,changePage:{shopping:null,tradein:null}};
  let generation=0;
  const changeRequestGeneration={shopping:0,tradein:0};
  const $=id=>document.getElementById(id);
  function esc(value){return String(value==null?'':value).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));}
  function setStatus(text,kind){const el=$('queryStatus');el.textContent=text;el.className='status'+(kind?' '+kind:'');}
  function invoke(kind){
    return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'threec_snapshot_read',kind}),cache:'no-store',credentials:'omit'}).then(async response=>{let body={};try{body=await response.json();}catch{throw new Error('正式資料回應格式錯誤');}if(!response.ok||!body||body.status!=='ok')throw new Error(body&&body.message||'正式資料讀取失敗');return body;});
  }
  function invokeChanges(kind,offset,limit,snapshotHash,search){
    return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'threec_changes_read',kind,offset:Number(offset||0),limit:Number(limit||1000),snapshotHash:snapshotHash||'',search:String(search||'')}),cache:'no-store',credentials:'omit'}).then(async response=>{let body={};try{body=await response.json();}catch{throw new Error('正式異動回應格式錯誤');}if(!response.ok||!body||body.status!=='ok')throw new Error(body&&body.message||'正式異動讀取失敗');return body;});
  }
  function clearResults(){state.shopping=null;state.tradein=null;state.changePage={shopping:null,tradein:null};renderKind('shopping');renderKind('tradein');}
  function metaHtml(meta){const hash=meta.sourceFileSha256||'—';return `<div class="metric"><span>正式資料版本（snapshot hash）</span><strong>${esc(meta.snapshotHash||meta.version||'—')}</strong></div><div class="metric"><span>來源日期</span><strong>${esc(meta.sourceVersionDate||'—')}</strong></div><div class="metric"><span>發布時間</span><strong>${esc(meta.publishedAt||'—')}</strong></div><div class="metric wide"><span>來源 SHA-256</span><strong>${esc(hash)}</strong></div>`;}
  function renderPrice(name,value){const state=Core.priceState(value);return `<div class="price-item${state.missing?' missing':''}${state.zero?' zero':''}"><span>${esc(name)}</span><strong>${esc(Core.formatPrice(value))}</strong></div>`;}
  function changeRows(changeSet){if(!changeSet||typeof changeSet!=='object')return [];if(Array.isArray(changeSet.changePage))return changeSet.changePage;if(Array.isArray(changeSet.changes))return changeSet.changes;if(Array.isArray(changeSet.records))return changeSet.records;return [];}
  function changeCounts(changeSet){const counts=changeSet&&changeSet.counts&&typeof changeSet.counts==='object'?changeSet.counts:{};return {added:Number(changeSet&&changeSet.addedCount!=null?changeSet.addedCount:counts.added||0),changed:Number(changeSet&&changeSet.changedCount!=null?changeSet.changedCount:counts.changed||0),unchanged:Number(changeSet&&changeSet.unchangedCount!=null?changeSet.unchangedCount:counts.unchanged||0),removed:Number(changeSet&&changeSet.removedCount!=null?changeSet.removedCount:counts.removed||0)};}
  function changePrice(value){if(value==null)return '—（無此條件）';if(value&&typeof value==='object'&&Object.prototype.hasOwnProperty.call(value,'value'))return Core.formatPrice(value.value);if(value&&typeof value==='object'&&Object.prototype.hasOwnProperty.call(value,'display'))return String(value.display||'無報價（缺價）');return Core.formatPrice(value);}
  function changePriceClass(value){if(value==null||(value&&value.kind==='missing')||String(value).trim()==='')return 'missing';if((value&&value.kind==='zero')||Number(String(value).replace(/,/g,''))===0)return 'zero';return '';}
  function changeText(record){const identity=record&&record.identity||{};return [record&&(record.modelCapacity||record.model),record&&(record.plan||record.condition),record&&(record.provider||identity.provider),record&&(record.grade||identity.grade)].filter(Boolean).join(' ');}
  function responseChangeSet(response){const check=response&&response.updateCheck;return check&&check.changeSet?check.changeSet:(response&&response.changeSet)||null;}
  function renderChanges(kind){
    if(kind!==state.active)return;
    const response=state[kind];
    const title=kind==='shopping'?'手機專案／3C':'舊換新';
    $('changeTitle').textContent=title+' 本次異動／版本檢查';
    if(!response||!response.snapshot){$('changeBasis').textContent='尚無正式異動記錄。';$('changeCounts').innerHTML='';$('changeResults').innerHTML='<div class="empty">尚無異動記錄。</div>';['changePrevBtn','changeNextBtn','changeJsonBtn','changeCsvBtn'].forEach(id=>$(id).disabled=true);return;}
    const snapshot=response.snapshot||{};const set=state.changePage[kind]||responseChangeSet(response);if(!set){$('changeBasis').textContent='正式版本已讀取；後端尚未提供異動記錄。';$('changeCounts').innerHTML='';$('changeResults').innerHTML='<div class="empty">尚無異動記錄。</div>';['changePrevBtn','changeNextBtn','changeJsonBtn','changeCsvBtn'].forEach(id=>$(id).disabled=true);return;}
    const query=$('changeSearch').value.trim();const loadedSearch=String(set._search==null?'':set._search);const pendingSearch=query!==loadedSearch;const counts=changeCounts(set);const rows=pendingSearch?[]:changeRows(set);const changeCount=Number(set.changeCount!=null?set.changeCount:rows.length);const totalChangeCount=Number(set.totalChangeCount!=null?set.totalChangeCount:(set.totalCount!=null?set.totalCount:changeCount));const offset=Number(set.offset||0);const limit=Number(set.limit||100);const page=Math.floor(offset/Math.max(1,limit))+1;const pageCount=Math.max(1,Math.ceil(changeCount/Math.max(1,limit)));
    const activeHash=snapshot.snapshot_hash||'';const update=response.updateCheck||{};const updateBlocked=update.blocked||update.status==='blocked'||update.ok===false||update.matches===false;const latest=update.latest_check||update.latestCheck||update;const latestDate=latest&&(latest.source_version_date||latest.date||latest.latest_source_version_date);const latestRows=latest&&(latest.row_count!=null?latest.row_count:latest.source_row_count);const latestText=latestDate||latestRows!=null||latest.status?'；最近來源核對日期 '+(latestDate||'—')+'／'+(latestRows==null?'—':latestRows)+' 筆／'+(latest.status||'已核對'):'';
    $('changeBasis').textContent='價格 active 版本：'+(activeHash||'—')+'；版本日期 '+(snapshot.source_version_date||'—')+latestText+'；異動資料以 active／previous 讀回為準。'+(updateBlocked?' 目前 active 已更新，請重新讀取。':'');
    $('changeCounts').innerHTML=[['changed','調價（筆報價條件）'],['added','新增報價條件'],['unchanged','未變報價條件'],['removed','移除報價條件']].map(pair=>`<div class="change-count"><span>${pair[1]}</span><strong>${counts[pair[0]].toLocaleString('zh-TW')}</strong></div>`).join('');
    $('changeSummary').textContent=pendingSearch?'正在搜尋完整異動條件…':'本頁顯示 '+rows.length+' 筆；搜尋符合 '+changeCount.toLocaleString('zh-TW')+' 筆，整版共 '+totalChangeCount.toLocaleString('zh-TW')+' 筆報價條件（含缺價欄位，不等同 Excel 機款列數）。';
    const html=rows.slice(0,100).map(record=>`<tr><td>${esc(record.status==='changed'?'調價':record.status==='added'?'新增':record.status==='removed'?'移除':'未變')}</td><td>${esc(record.modelCapacity||record.model||'—')}</td><td>${esc(record.plan||record.condition||'—')}</td><td>${esc(record.provider||'—')}</td><td>${esc(record.grade||'—')}</td><td class="${changePriceClass(record.before)}">${esc(changePrice(record.before))}</td><td class="${changePriceClass(record.after)}">${esc(changePrice(record.after))}</td></tr>`).join('');
    $('changeResults').innerHTML=html?`<table><thead><tr><th>狀態</th><th>機款／容量</th><th>完整資費／合約／條件</th><th>回收商</th><th>等級</th><th>之前</th><th>目前</th></tr></thead><tbody>${html}</tbody></table>`:'<div class="empty">本頁沒有符合搜尋條件的異動。</div>';
    $('changePage').textContent='第 '+page+' 頁／共 '+pageCount+' 頁';$('changePrevBtn').disabled=pendingSearch||offset<=0;$('changeNextBtn').disabled=pendingSearch||!set.hasMore;$('changeJsonBtn').disabled=pendingSearch||!set;$('changeCsvBtn').disabled=pendingSearch||!set;
  }
  function changePageSize(set){return Number(set&&set.limit||100);}
  async function loadChangePage(kind,offset,search){const requestGeneration=generation;const changeRequest=++changeRequestGeneration[kind];const response=state[kind];if(!response||!response.snapshot)return;const query=String(search==null?$('changeSearch').value.trim():search);const hash=response.snapshot.snapshot_hash||'';const result=await invokeChanges(kind,offset,100,hash,query);if(requestGeneration!==generation||changeRequest!==changeRequestGeneration[kind]||state[kind]!==response)return;state.changePage[kind]=Object.assign({},result.changeSet||{},{_search:query});renderChanges(kind);}
  async function fetchAllChanges(kind,search){const requestGeneration=generation;const response=state[kind];if(!response||!response.snapshot)return null;const query=String(search==null?$('changeSearch').value.trim():search);const hash=response.snapshot.snapshot_hash||'';let offset=0;let first=null;let next=null;const records=[];do{const result=await invokeChanges(kind,offset,1000,hash,query);if(requestGeneration!==generation||state[kind]!==response)return null;next=result.changeSet||{};if(next.firstRelease&&DiffCore){const local=DiffCore.diffSnapshots(kind,null,response.snapshot,{limit:Infinity,search:query});return {set:local,records:changeRows(local),search:query};}if(!first)first=next;records.push(...changeRows(next));offset+=Number(next.limit||1000);}while(next.hasMore);return {set:first||{},records,search:query};}
  async function downloadChanges(kind,format){const fetched=await fetchAllChanges(kind);if(!fetched)return;const set=fetched.set;const records=fetched.records;const body=format==='json'?JSON.stringify({unit:'報價條件',snapshotHash:state[kind].snapshot.snapshot_hash||'',search:fetched.search,totalChangeCount:Number(set.totalChangeCount!=null?set.totalChangeCount:(set.changeCount||records.length)),changeCount:Number(set.changeCount!=null?set.changeCount:records.length),counts:changeCounts(set),changes:records},null,2):[['unit','status','model_or_capacity','condition','provider','grade','before','after'],...records.map(record=>['報價條件',record.status,record.modelCapacity||record.model,record.plan||record.condition,record.provider,record.grade,changePrice(record.before),changePrice(record.after)])].map(row=>row.map(value=>`"${String(value==null?'':value).replace(/"/g,'""')}"`).join(',')).join('\n');const url=URL.createObjectURL(new Blob([format==='json'?body:'\ufeff'+body],{type:format==='json'?'application/json;charset=utf-8':'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='threec-'+kind+'-changes.'+format;link.click();setTimeout(()=>URL.revokeObjectURL(url),0);}
  function renderShopping(view){
    const target=$('shoppingResults');
    if(!view){$('shoppingMeta').innerHTML='';target.innerHTML='<div class="empty">尚未讀取正式手機專案資料。</div>';return;}
    if(!view.available){$('shoppingMeta').innerHTML='';target.innerHTML='<div class="empty">尚未發布正式資料：手機專案／3C。</div>';return;}
    $('shoppingMeta').innerHTML=metaHtml(view.meta);
    if(!view.rows.length){target.innerHTML='<div class="empty">沒有符合搜尋條件的正式機款。</div>';return;}
    const notice=view.limited?`<div class="status warn">目前顯示前 ${view.displayLimit} 組（符合條件共 ${view.totalRows} 組）。請先從「選機款」縮小範圍後查看完整資料。</div>`:'';
    target.innerHTML=notice+view.rows.map(group=>`<article class="group"><h3 class="group-title">${esc([group.brand,group.colorlessModel].filter(Boolean).join(' · ')||'未命名機款')}</h3><p class="group-note">來源工作表：${esc(group.sourceSheet||'—')}；同色款合併查詢，容量／必要型號差異仍保留</p><div class="table-scroll"><table><thead><tr><th>原始機型／容量</th><th>代碼</th><th>單機價</th><th>資費／合約／適用條件（原始欄名）</th></tr></thead><tbody>${group.rows.map(row=>`<tr><td>${esc(row.model||'—')}</td><td>${esc(row.code||'—')}</td><td>${renderPrice('單機價',row.retailPrice)}</td><td><div class="price-list">${row.projectPrices.length?row.projectPrices.map(price=>renderPrice(price.name,price.value)).join(''):'<span class="hint">無專案價欄位</span>'}</div></td></tr>`).join('')}</tbody></table></div></article>`).join('');
  }
  function renderTradein(view){
    const target=$('tradeinResults');
    if(!view){$('tradeinMeta').innerHTML='';target.innerHTML='<div class="empty">尚未讀取正式舊換新資料。</div>';return;}
    if(!view.available){$('tradeinMeta').innerHTML='';target.innerHTML='<div class="empty">尚未發布正式資料：舊換新。</div>';return;}
    $('tradeinMeta').innerHTML=metaHtml(view.meta);
    if(!view.rows.length){target.innerHTML='<div class="empty">沒有符合搜尋條件的正式機款。</div>';return;}
    const notice=view.limited?`<div class="status warn">目前顯示前 ${view.displayLimit} 筆（符合條件共 ${view.totalRows} 筆）。請先從「選機款」縮小範圍後查看完整資料。</div>`:'';
    target.innerHTML=notice+view.rows.map(row=>`<article class="provider"><h3>${esc([row.brand,row.model].filter(Boolean).join(' · ')||'未命名機款')}</h3><p class="group-note">來源工作表：${esc(row.sourceSheet||'—')}</p>${Core.PROVIDERS.map(provider=>`<div class="table-scroll"><table><thead><tr><th colspan="${Core.GRADES.length+1}">${esc(provider)}（獨立報價）</th></tr><tr><th>原始機型／容量</th>${Core.GRADES.map(grade=>`<th>${grade} 級</th>`).join('')}</tr></thead><tbody><tr><td>${esc(row.model||'—')}</td>${Core.GRADES.map(grade=>`<td>${esc(Core.formatPrice(row.quotes[provider]&&row.quotes[provider][grade]))}</td>`).join('')}</tr></tbody></table></div>`).join('')}</article>`).join('');
  }
  function renderKind(kind){const search=$(kind==='shopping'?'shoppingSearch':'tradeinSearch').value;const modelKey=$(kind==='shopping'?'shoppingModel':'tradeinModel').value;const response=state[kind];const view=response?Core.buildView(kind,response,{query:search,modelKey}):null;if(kind==='shopping')renderShopping(view);else renderTradein(view);renderChanges(kind);if(view){const select=$(kind==='shopping'?'shoppingModel':'tradeinModel');const prior=select.value;select.innerHTML='<option value="">全部機款</option>'+view.modelOptions.map(option=>`<option value="${esc(option.value)}">${esc(option.label)}</option>`).join('');if(view.modelOptions.some(option=>option.value===prior))select.value=prior;}}
  function showKind(kind){state.active=kind;['shopping','tradein'].forEach(value=>{const tab=$(value+'Tab'),pane=$(value+'Pane');const active=value===kind;tab.classList.toggle('active',active);tab.setAttribute('aria-selected',String(active));pane.classList.toggle('hidden',!active);});renderChanges(kind);const query=$('changeSearch').value.trim();const set=state.changePage[kind]||responseChangeSet(state[kind]);if(state[kind]&&(!set||String(set._search||'')!==query))loadChangePage(kind,0,query).catch(error=>setStatus(error.message,'bad'));}
  async function refresh(){
    const requestGeneration=++generation;
    state.loading=true;$('refreshBtn').disabled=true;setStatus('正在讀取兩類正式價格…');clearResults();
    try{
      const results=await Promise.all([invoke('shopping'),invoke('tradein')]);
      if(requestGeneration!==generation)return;
      state.shopping=results[0];state.tradein=results[1];
      const available=results.filter(result=>result&&result.snapshot).length;
      const missingKinds=results.map((result,index)=>result&&result.snapshot?'':index===0?'手機專案／3C':'舊換新').filter(Boolean);
      setStatus(available===2?'已讀取正式資料；請依版本／日期核對後查詢。':`已讀取；${missingKinds.join('、')} 尚未發布正式資料，可查詢已有正式版本。`,available?'ok':'warn');
      renderKind('shopping');renderKind('tradein');
    }catch(error){
      if(requestGeneration!==generation)return;
      clearResults();setStatus(String(error.message||'正式資料讀取失敗')+'；正式資料已清除。','bad');
    }finally{if(requestGeneration===generation){state.loading=false;$('refreshBtn').disabled=false;}}
  }
  function bind(){
    $('refreshBtn').addEventListener('click',refresh);
    document.querySelectorAll('[data-kind]').forEach(button=>button.addEventListener('click',()=>showKind(button.dataset.kind)));
    ['shopping','tradein'].forEach(kind=>{const search=$(kind+'Search'),select=$(kind+'Model');search.addEventListener('input',()=>renderKind(kind));select.addEventListener('change',()=>renderKind(kind));});
    let changeSearchTimer=0;
    $('changeSearch').addEventListener('input',()=>{const kind=state.active;const query=$('changeSearch').value.trim();state.changePage[kind]=null;renderChanges(kind);clearTimeout(changeSearchTimer);changeSearchTimer=setTimeout(()=>loadChangePage(kind,0,query).catch(error=>setStatus(error.message,'bad')),250);});
    $('changePrevBtn').addEventListener('click',()=>{const kind=state.active;const set=state.changePage[kind]||responseChangeSet(state[kind]);const size=changePageSize(set);if(set&&Number(set.offset||0)>=size)loadChangePage(kind,Math.max(0,Number(set.offset||0)-size),$('changeSearch').value.trim()).catch(error=>setStatus(error.message,'bad'));});
    $('changeNextBtn').addEventListener('click',()=>{const kind=state.active;const set=state.changePage[kind]||responseChangeSet(state[kind]);if(set&&set.hasMore)loadChangePage(kind,Number(set.offset||0)+changePageSize(set),$('changeSearch').value.trim()).catch(error=>setStatus(error.message,'bad'));});
    $('changeJsonBtn').addEventListener('click',()=>downloadChanges(state.active,'json').catch(error=>setStatus(error.message,'bad')));
    $('changeCsvBtn').addEventListener('click',()=>downloadChanges(state.active,'csv').catch(error=>setStatus(error.message,'bad')));
    scope.addEventListener('pagehide',()=>{generation+=1;clearResults();});
    scope.addEventListener('pageshow',event=>{if(event.persisted)refresh();});
    showKind('shopping');
    refresh();
  }
  if(!Core){setStatus('查詢元件載入失敗。','bad');return;}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})(window);
</script>
</body>
</html>
