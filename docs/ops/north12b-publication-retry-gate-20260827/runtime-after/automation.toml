prompt = "每天執行北一二B每日戰報、Y26 台獎與正式網站發布。開始前必須完整讀取 `/Users/liamlu/Downloads/liam-agent/AGENTS.md`、`report-automation/docs/DAILY_REPORT_CONTRACT.md`、`report-automation/twm-onedrive-daily-report-workflow.md`、`report-automation/south-2-addon-kpi-report-spec.md` 及 `/Users/liamlu/.codex/automations/b-2/memory.md`；以 DAILY_REPORT_CONTRACT 為發布、retry、完成 gate、冪等與安全紀錄的權威契約。\n\n任何 Google Drive source 存取、報表 build、Outlook 寄送之前，第一個執行 gate 固定為 `/usr/bin/env -i HOME=\"$HOME\" USER=\"$USER\" PATH=\"/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin\" /bin/zsh /Users/liamlu/Downloads/liam-agent/report-automation/work/automation_environment_preflight_with_keychain.sh`。此 gate 必須從 macOS Login Keychain 專用項目載入並驗證 `REPORT_UPLOAD_EMPLOYEE_ID`，同時確認管理者 Keychain、Node、curl 與 publish/readback endpoint 依賴；只可記錄 PASS/BLOCKED 與檢查名稱，不得輸出、推測或保存員編、密碼、token 或 Keychain 值。缺少、格式錯誤或非持久來源均屬 non-retryable configuration failure，必須立即以 BLOCKED 結束，source/build/send/publish/readback invocation 全部為 0，不得進入 HTTP retry。local preflight PASS 後，才可用 read-only 操作確認 Google Drive 與 Outlook connector 已連線且 auth 可用；connector auth 失敗同樣在 source/build/mail 前 BLOCKED。\n\n正式來源只允許已授權 Google Drive connector 固定 folder `01_北一二B_營運與系統/業績報表`（folder ID `1zs4flckF4uysz55tXkAxojM5-yB6a9sH`），provider 必須是 `google-drive-cloud`。KPI 精準抓當日 `MMDD.xlsx`；台獎精準抓 canonical `01-08-03...店點達成率、排名及獎金.xlsx` 與 `01-08-04...個人達成率、排名及獎金.xlsx`。不得 fallback 到 OneDrive、本機 CloudStorage、staging、outputs、cache、latest 或舊資料。透過 connector bridge 安全 materialize raw bytes，建立 mode 0600 run-scoped immutable staging；file ID、basename、modifiedTime、size、MIME、ZIP magic、source_data_date、run_id 與 cloud/download/staged SHA-256 必須一致。KPI 與 awards 使用同一 cutoff/source batch；awards 單邊更新只 BLOCK awards，不得阻擋 KPI。\n\n依正式文件執行 Google Drive source/previous-source preflight、`run_daily_north12b_report.mjs`、台獎更新與 `prepare_send_payloads.mjs`。每日戰報與台獎信各自通過 build/preflight 才可寄送；兩封寄出後必須查 Outlook `寄件備份` 驗證主旨、direct attachments 名稱與數量。M+ `滷蛋` 四附件為 best-effort、non-blocking，失敗不得改動 Outlook 或網站流程。不得重寄已由 Sent Items 驗證的郵件。\n\nKPI 與 awards 維持 component-level independence，分別以六段 gate 判定：`source PASS → build PASS → Outlook mail verified → component published → Website readback PASS → Supervisor App readback PASS`。只有各自六段全 PASS 才能標該 component 正式成功；郵件成功、Drive update、local JSON、Pages 可開或 HTTP 200 都不是 Website/App readback。awards BLOCKED 不得阻擋或回退 KPI。\n\npublish/readback 只對 HTTP 404、429、500、502、503、504、network exception、timeout 做有限 retry：第一次失敗等 2 秒，第二次失敗等 5 秒，最多 3 次。不得 retry 400/401/403/409/422、authentication/authorization、missing credential、configuration failure、source 日期錯誤、hash/run_id 不一致、schema 錯誤、awards 單邊更新或任何 business validation failure；這些必須立即 fail-closed。使用 `private_dashboard_transport.mjs`、`publication_transport_client.mjs` 與 `publication_attempt_log.mjs` 的正式 retry/安全紀錄契約。\n\n若 source/build/Outlook 驗證已完成而 publish/readback 未完成，先核對已驗證 artifact/manifest 的 reportDate、cutoff、run_id、SHA-256，再只續跑尚未完成的 `publish → Website readback → Supervisor App readback`。禁止重新抓或解析 Google Drive、重建 Excel/PNG、重寄 Outlook。已 fresh 且 exact readback 符合的 component 必須 idempotent skip。正式 Drive 原 file ID 更新前保存原 bytes/modifiedTime/SHA-256/PRIVATE 權限供 rollback；不得新建正式 file ID。\n\n發布後 Website 與 Supervisor App 各自實際讀回 KPI 與台獎：資料必須是本次 report run、正確 cutoff，同一 run identity；KPI 至少驗證 9 店、40 人、25 KPI 及核心聚合；awards 至少驗證 13 機款、10 rows、9 店。受保護 UI 未登入、只顯示登入頁或無法精確讀值時維持 BLOCKED，不得標 DONE，也不得讀取、顯示或記錄員編、bootstrap code、device/session token、管理者密碼或 OAuth token。\n\n失敗/retry log 只保留 timestamp、report_date、cutoff、run_id、component、action、attempt、HTTP status、移除 query/hash 的 response URL、redirected、Content-Type、exception type、retrying、retry_succeeded；credential preflight log 只可記錄 action、status、failure_class、retryable 與失敗檢查名稱。不得記錄 POST body、私有 KPI 明細或任何憑證。每日更新 `run-manifest-YYYYMMDD.json` 的 component gate 與 readback 證據；完成前把摘要追加到 b-2 memory。最後以繁體中文分別回報 env/auth preflight、來源/build/Outlook/KPI publish/awards publish/Website KPI/Website awards/Supervisor KPI/Supervisor awards 的狀態，未通過者明確列為 BLOCKED。"
