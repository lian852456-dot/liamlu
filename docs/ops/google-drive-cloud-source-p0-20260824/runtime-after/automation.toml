name = "每日北一二B戰報與台獎機款進度產出"
prompt = "每天產出北一二B每日戰報與 Y26 台獎機款進度。開始前先讀取專案中的 `AGENTS.md`、`/Users/liamlu/Downloads/liam-agent/report-automation/south-2-addon-kpi-report-spec.md`、`/Users/liamlu/Downloads/liam-agent/report-automation/twm-onedrive-daily-report-workflow.md`、`/Users/liamlu/Downloads/liam-agent/report-automation/docs/DAILY_REPORT_CONTRACT.md`，並讀取 `/Users/liamlu/.codex/automations/b-2/memory.md`。\n\n正式來源固定為已授權的 Google Drive connector 直接讀取 `01_北一二B_營運與系統/業績報表`，folder ID `1zs4flckF4uysz55tXkAxojM5-yB6a9sH`。Production 只允許 `provider=google-drive-cloud`，禁止 fallback 到 OneDrive、本機 CloudStorage、staging、outputs、cache 或舊資料；雲端列檔、下載、identity、日期或任一 canonical 檔案缺失即 BLOCKED。KPI 依 Asia/Taipei report run date 精準抓 `MMDD.xlsx`；台獎精準抓 canonical `01-08-03...店點達成率、排名及獎金.xlsx` 與 `01-08-04...個人達成率、排名及獎金.xlsx`，不得接受 duplicate suffix。每次必須保存 Google Drive file ID、canonical basename、modifiedTime、size、下載 SHA-256、Excel source_data_date 與 run_id；Google Drive API 未提供 eTag 時不得偽造。下載 bytes 必須先寫入 run-scoped transport，再由 `preflight_google_drive_cloud_sources.mjs` 建立含 run_id、file ID/hash 的 0600 immutable staging，且 staged SHA 必須等於 cloud download SHA。connector handoff 不得包含 OAuth token 或任何憑證。\n\n每日流程必須先用 Google Drive connector 列出固定 folder，下載今日三份 raw xlsx，建立 schema `north12b-google-drive-cloud-handoff/v1` 的 handoff JSON，明確設定 `allow_local_fallback=false`、`allow_onedrive_fallback=false`。接著執行：\n`GOOGLE_DRIVE_CLOUD_HANDOFF=<handoff.json> REPORT_DATA_CUTOFF_DATE=YYYY-MM-DD node /Users/liamlu/Downloads/liam-agent/report-automation/work/preflight_google_drive_cloud_sources.mjs`\n只有回傳 `status=preflight-pass`、三份 SHA 完整且三份 Excel source_data_date 全等於 KPI cutoff 才可續跑。完整每日 KPI runner 必須明確使用：\n`REPORT_SOURCE_MODE=google-drive-cloud GOOGLE_DRIVE_SOURCE_MANIFEST=<cloud-source-manifest.json> REPORT_DATE_ISO=YYYY-MM-DD node /Users/liamlu/Downloads/liam-agent/report-automation/work/run_daily_north12b_report.mjs`\n任何 Google Drive auth 或 connector 失敗都不得改走 OneDrive/local。\n\nrunner 會自動抓前日比較欄位、輸出每日戰報 Excel、主力KPI PNG、加掛得分 PNG、手機保險 PNG、QIS PNG，以及個績三張 PNG：店長、副店、業代。AQ高資已於 2026-08-22 正式取消固定產出：不得要求 `AQ高資` 頁籤、不得要求 `TWM_North12B_AQ_High_Value_YYYY-MM-DD.png`，也不得因來源缺少 AQ-Voice AQ 而阻擋每日戰報；除非使用者明確要求恢復，否則 AQ高資不列入頁籤、PNG、preflight 或附件清單。\n\n報表頁籤順序固定為：`主力KPI`、`加掛得分`、`手機保險`、`QIS店績`、`主管摘要`、`資料來源`。`手機保險` 頁籤需呈現前日、今日與 DOD 進度／搭售率；`QIS店績` 頁籤需呈現計件數、服務態度、專業能力與原始分數。主管摘要、郵件與 `主力KPI` 頁籤中的 KPI 排名必須使用公司全體 KPI 排名；`加掛得分` 明細表內的 `KPI排名` 維持北一二B店內排序。低於 100% 的達成率要用紅字與淡紅底標示。\n\n個績戰報固定從每日來源檔 `上線數KPI_個人達成率_明細` 或既有 runner 支援的同語意頁籤抽北一二B人員，分成店長（含代理）、副店、業代（含銷售人員）三張圖片。欄位必須包含 AQ、A999、A1399、RT、R999、R1399、好速；每項呈現 `實際數`、`達成率`、`100%差異數`，差異數固定用 `實際數 - 目標數` 計算。店長達成率欄不使用底色提醒，只提醒 AQ 實際點數低於 10 點，且 AQ 實際數低於 10 點時用紅字或淡紅底標示。副店與業代需各自依總達成率由高到低排序，總達成與各 KPI 達成率用顏色呈現表現好壞，提醒欄列出前三個主要缺口；副店與業代兩張圖都需加入 DOD 欄，以員編優先比對前日同來源頁籤，計算 `今日總達成率 - 前日總達成率`。\n\n同次自動化還必須產出 Y26 台獎機款進度。必須沿用同一份已通過的 Google Drive cloud manifest，以 `PHONE_AWARDS_SOURCE_MODE=google-drive-cloud` 與 `PHONE_AWARDS_CLOUD_MANIFEST=<cloud-source-manifest.json>` 執行；不得重新解析另一來源、不得混用 OneDrive/local。兩份 awards raw SHA 都必須相對前一正式版本更新，任何單邊更新、hash 未變、下載/staging SHA 不一致或 source_data_date 不等於 KPI cutoff，都只維持台獎 BLOCKED，不可阻擋已通過 gate 的 KPI，也不可 fallback。\n\n台獎腳本必須使用 bundled Python：\n`/Users/liamlu/.cache/codex-runtimes/codex-primary-runtime/dependencies/python/bin/python3.12 /Users/liamlu/Downloads/liam-agent/report-automation/work/update_phone_awards.py`\n\n台獎流程必須先用最新 `01-08-03` / `01-08-04` 更新 `Y26重點台獎手機` 工作簿內的 `台獎機款`、`個人台獎` 頁籤，再從更新後的 Y26 頁籤重產 `台獎機款.png` 與 `個人台獎.png`。跑完後必須檢查 `report-automation/outputs/phone_awards_update_summary.json`，確認 `phone_items` 等於 `report-automation/config/award-config-active.json` 指向月設定的 `expectedPhoneItems`，且 `store_rows` 等於 `expectedStoreRows`；若不符 active 月設定，不可寄送台獎郵件。\n\n台獎提醒口徑固定為：北一二B整體列出未達 80% 的機款，其他各店點維持列出未達 50% 的機款。台獎點名與 mail 內文必須同時呈現機款達成率與尚缺台數，例如 `OPPO Reno15 55%（尚缺 27 台）`。\n\n寄送前必須先執行：\n`REPORT_DATE_ISO=YYYY-MM-DD node /Users/liamlu/Downloads/liam-agent/report-automation/work/prepare_send_payloads.mjs`\n\n這一步必須通過下列檢查後才能寄送：\n- `today_report_data.json` 日期符合今天。\n- 台獎 `phone_items` 等於 active 月設定 `expectedPhoneItems`、`store_rows` 等於 active 月設定 `expectedStoreRows`。\n- 台獎 summary 含 `risk_threshold=0.8` 的北一二B整體風險列，以及各店 `risk_threshold=0.5` 的風險列。\n- 台獎 mail body 需出現 `北一二B整體未達80%機款`、`各店未達50%前三大缺口與尚缺台數`，且缺口項目需含 `尚缺 X 台`。\n- 每日戰報 8 個附件存在：Excel、主力KPI PNG、加掛得分 PNG、店長個績 PNG、副店個績 PNG、業代個績 PNG、手機保險 PNG、QIS PNG。\n- 台獎 6 個附件存在。\n- 所有直接附件都小於 3MB。\n\n每日戰報寄送規則：\n- 寄給 `lian852456@gmail.com`。\n- 主旨：`北一二B每日戰報 YYYY-MM-DD`。\n- `attachment_files` 必須使用實際路徑陣列。\n- 標準交付必須直接附上 8 個附件：`TWM_North12B_Daily_Report_YYYY-MM-DD.xlsx`、`TWM_North12B_Main_KPI_YYYY-MM-DD.png`、`TWM_North12B_Addon_Score_YYYY-MM-DD.png`、`TWM_North12B_Personal_Manager_YYYY-MM-DD.png`、`TWM_North12B_Personal_Deputy_YYYY-MM-DD.png`、`TWM_North12B_Personal_Sales_YYYY-MM-DD.png`、`TWM_North12B_Insurance_YYYY-MM-DD.png`、`TWM_North12B_QIS_YYYY-MM-DD.png`。\n\n台獎寄送規則：\n- 主旨：`北一二B台獎機款進度 YYYY-MM-DD`。\n- 同樣寄給 `lian852456@gmail.com`。\n- `attachment_files` 必須使用實際路徑陣列。\n- 同一封信一次附上 6 個附件：`Y26重點台獎手機_台獎更新.xlsx`、店點台獎更新 Excel、個人台獎更新 Excel、`台獎機款.png`、`個人台獎.png`、`台獎機款_店點進度點名.md`。\n\nZIP 只能作為 Outlook 多附件失敗時的緊急備援，不可作為標準流程。兩封郵件寄出後，都必須查 Outlook `寄件備份` 驗證主旨正確、`has_attachments=true`、附件清單與預期檔名一致。\n\nKPI 與 awards 採 component-level 發布。KPI 已 fresh 時，stale awards 不得阻擋 KPI；awards fresh run 通過後只發布 `awardsBattle` component，必須逐值保留 KPI payload/component 與 KPI hash。發布後分別從 Website 與 Supervisor App 實際 readback 台獎日期、13 機款與九店資料；未完成兩端 readback 不得標台獎 PASS。不得讀出、顯示、記錄或寫入管理者密碼。\n\n來源晚到 1 小時一次性續跑（2026-08-09 核准）：只有在 Google Drive 固定 folder 找不到 Asia/Taipei 今日 KPI canonical 來源檔時啟動；不得 fallback OneDrive 或本機。停止時執行 `node /Users/liamlu/Downloads/liam-agent/report-automation/work/late_source_retry_state.mjs schedule --report-date YYYY-MM-DD --stopped-at '<實際 ISO-8601 停止時間>' --delay-minutes 60`，讀取 `retryAt`，用 Codex automation_update 建立附著於本次 task 的一次性 local heartbeat/follow-up，準確排在 retryAt；不得改動本 automation 的 09:45 RRULE，不得建立高頻輪詢或第二次 retry。follow-up prompt 必須要求先完整讀取 `/Users/liamlu/Downloads/liam-agent/report-automation/docs/LATE_SOURCE_RETRY.md` 並以本次日期續跑。follow-up 開始時必須先以 `late_source_retry_state.mjs begin` 取得一次性執行權；若一小時後來源仍缺失，記錄 `source-still-missing` 後正常結束，不發布昨日資料，也不再排下一次。續跑前必須以 manifest、Outlook 寄件備份、Drive／網站正式讀回做冪等檢查，只補未完成項。\n\n完成前請把本次執行摘要追加到 `/Users/liamlu/.codex/automations/b-2/memory.md`。完成後用繁體中文回報本機輸出路徑、實際來源檔案與來源日期、北一二B整體公司排名/KPI/加掛得分、未達 15 分店數與名單、個績三類人數與主要缺口、台獎整體未達 80% 機款與尚缺台數、各店未達 50% 前三大缺口與尚缺台數、寄件備份與網站發布驗證結果。"
