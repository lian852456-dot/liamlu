<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>舊換新專區｜北一二B</title>
  <link rel="stylesheet" href="threec-query.css?v=20261007-compact-2">
<link rel="stylesheet" href="tradein-area.css?v=20261009-public-1">
</head>
<body data-query-kind="tradein">
<main>
  <section class="hero">
    <div class="topbar"><div><h1>舊換新專區</h1><p>回收價查詢與區、店、個人每月目標進度</p></div><a class="home-link" href="home.html">← 智慧營運中心</a></div>
  </section>
  <nav class="area-nav" aria-label="舊換新專區功能"><a class="active" aria-current="page" href="tradein-query.html">回收價查詢</a><a href="tradein-progress.html">目標進度</a></nav>
<section class="card" id="queryCard">
    <div class="topbar"><h2 style="margin:0">回收價查詢</h2><button class="secondary" id="refreshBtn" type="button">重新整理</button></div>
    <div id="queryStatus" class="status" role="status">正在讀取正式價格…</div>
    <div class="tabs legacy-tabs" role="tablist" hidden><button class="tab active" id="shoppingTab" data-kind="shopping" type="button" role="tab" aria-selected="true">手機專案／3C</button><button class="tab" id="tradeinTab" data-kind="tradein" type="button" role="tab" aria-selected="false">舊換新</button></div>
    <section id="shoppingPane" data-pane="shopping" role="tabpanel">
      <div class="segment-switch" role="group" aria-label="方案專區"><button id="consumerSegmentBtn" type="button" aria-pressed="true">一般手機方案</button><button id="enterpriseSegmentBtn" type="button" aria-pressed="false">企業用戶專區</button></div>
      <h3 id="shoppingSectionTitle">一般手機方案</h3><p id="shoppingSectionDescription" class="hint">一般申辦方案；企業、員工與眷屬優惠請切換「企業用戶專區」。</p>
      <div id="shoppingMeta" class="meta"></div>
      <div class="shopping-toolbar">
        <label class="field search-field">搜尋機款或原始條件<input id="shoppingSearch" type="search" autocomplete="off" placeholder="例如：iPhone、256GB、續約"></label>
        <label class="field">品牌<select id="shoppingBrand"><option value="">全部品牌</option></select></label>
        <label class="field">機款<select id="shoppingModel"><option value="">全部機款</option></select></label>
        <label class="field">容量<select id="shoppingCapacity"><option value="">全部容量</option></select></label>
      </div>
      <details class="filter-details" open><summary>專案與資費篩選</summary><div class="plan-filters">
        <label class="field">專案<select id="shoppingProject"><option value="">全部專案</option></select></label>
        <label class="field">版本<select id="shoppingVersion"><option value="">一般／VIP／加碼</option></select></label>
        <label class="field">月租<select id="shoppingRent"><option value="common">999＋1399</option><option value="">全部月租</option></select></label>
        <label class="field">合約期數<select id="shoppingTerm"><option value="">全部期數</option></select></label>
      </div></details>
      <div class="shortcut-bar" aria-label="常用比較"><span>常用</span><button class="secondary" data-shortcut="common" type="button">999＋1399 全期</button><button class="secondary" data-shortcut="999-24" type="button">999／24期</button><button class="secondary" data-shortcut="1399-48" type="button">1399／48期</button><button class="text-button" id="shoppingReset" type="button">重設篩選</button></div>
      <div class="comparison-toolbar"><p id="shoppingSummary" class="hint" role="status"></p><div class="view-switch" role="group" aria-label="閱讀方式"><button id="tableModeBtn" class="secondary" type="button" aria-pressed="true">橫向比較</button><button id="cardModeBtn" class="secondary" type="button" aria-pressed="false">單方案卡片</button></div></div>
      <label class="field card-selector hidden" id="cardConditionField">卡片閱讀方案<select id="shoppingCardCondition"></select></label>
      <div id="shoppingResults"></div>
      <div class="comparison-pagination"><div><button id="columnPrev" class="secondary" type="button">← 前一組條件</button><span id="columnPage" class="hint"></span><button id="columnNext" class="secondary" type="button">下一組條件 →</button></div><div><button id="rowPrev" class="secondary" type="button">上一頁機款</button><span id="rowPage" class="hint"></span><button id="rowNext" class="secondary" type="button">下一頁機款</button></div></div>
    </section>
    <section id="tradeinPane" class="hidden" data-pane="tradein" role="tabpanel"><div class="toolbar"><label class="field">搜尋品牌／機款／容量<input id="tradeinSearch" type="search" autocomplete="off" placeholder="例如：Galaxy、512GB"></label><label class="field">選機款<select id="tradeinModel"><option value="">全部機款</option></select></label></div><div class="toolbar"><label class="field">回收商<select id="tradeinProvider"><option value="">全部回收商</option><option>點子行動</option><option>FutureDial（FDI）</option><option>愛鋒派</option></select></label><label class="field">報價等級<select id="tradeinGrade"><option value="">全部等級</option><option value="S">S 級</option><option value="A">A 級</option><option value="B">B 級</option><option value="C">C 級</option><option value="未分級">來源未分級</option></select></label></div><div id="tradeinMeta" class="meta"></div><div id="tradeinResults"></div></section>
    <section id="changeCard" class="change-card" aria-live="polite"><h3 id="changeTitle" style="margin:0">本次異動／版本檢查</h3><details class="source-details"><summary>異動來源與版本核對</summary><p id="changeBasis" class="hint">尚未讀取正式異動。</p></details><div id="changeCounts" class="change-counts"></div><label class="field" style="margin-top:9px">搜尋完整異動條件<input id="changeSearch" type="search" autocomplete="off" placeholder="機款、容量、資費／合約、回收商或等級"></label><button class="secondary" id="changeLoadBtn" type="button" hidden>載入本次異動明細</button><p id="changeSummary" class="hint"></p><div id="changeResults" class="change-table"></div><div class="actions"><button class="secondary" id="changePrevBtn" type="button" disabled>上一頁</button><span id="changePage" class="hint" style="align-self:center">第 1 頁</span><button class="secondary" id="changeNextBtn" type="button" disabled>下一頁</button><button class="secondary" id="changeJsonBtn" type="button" disabled>下載完整 JSON</button><button class="secondary" id="changeCsvBtn" type="button" disabled>下載完整 CSV</button></div></section>
    <p class="privacy">免登入即可瀏覽；重新開啟或按「重新整理」會讀取最新正式價格。</p>
  </section>
</main>
<script src="threec-price-transport.js?v=20261001-load-1"></script>
<script src="threec-query-core.js?v=20261007-quoted-only-1"></script>
<script src="threec-comparison-core.js?v=20261007-priced-only-1"></script>
<script src="threec-price-diff-core.js?v=20261001-providers-1"></script>
<script src="threec-query-ui.js?v=20261009-public-1"></script>
</body>
</html>
