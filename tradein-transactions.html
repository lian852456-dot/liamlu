<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>舊換新成交明細｜北一二B</title>
  <script>
    const destination = new URL('tradein-progress.html?view=transactions', location.href);
    const month = new URLSearchParams(location.search).get('month');
    if (/^20\d{2}-(0[1-9]|1[0-2])$/.test(month || '')) destination.searchParams.set('month', month);
    location.replace(destination.href);
  </script>
</head>
<body><p><a href="tradein-progress.html?view=transactions">開啟舊換新成交明細</a></p></body>
</html>
