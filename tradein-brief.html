<body data-performance-release="supervisor" data-brief-access="locked">
<main>
  <section class="hero"><div class="topbar"><div><h1>舊換新一頁簡報</h1><p>督導專用 · 使用已核對的全區資料，下載可編輯 PowerPoint</p></div><a class="home-link" href="home.html">← 智慧營運中心</a></div></section>
  <nav class="area-nav" aria-label="舊換新專區功能"><a href="tradein-progress.html">目標進度</a><a href="tradein-query.html">回收價查詢</a><a class="active" aria-current="page" href="tradein-brief.html" data-supervisor-brief hidden>簡報產出</a></nav>
  <section id="briefAuth" class="card brief-auth" aria-labelledby="briefAuthTitle">
    <h2 id="briefAuthTitle">督導驗證</h2>
    <p>簡報產出僅限督導使用，請使用督導專區通行碼。</p>
    <form id="briefAuthForm">
      <label for="briefPasscode">督導通行碼<input id="briefPasscode" type="password" autocomplete="current-password" required></label>
      <button id="verifyBriefSupervisor" type="submit">驗證督導權限</button>
    </form>
    <p id="briefAuthStatus" role="status" aria-live="polite">請先完成督導驗證。</p>
    <noscript><p>請啟用 JavaScript 後完成督導驗證，才能產出簡報。</p></noscript>
  </section>
  <section id="briefWorkspace" hidden inert>
    <div class="brief-access"><span id="briefSessionStatus"></span><button id="briefLock" class="secondary" type="button">鎖定簡報</button><button class="secondary" type="button" data-portal-logout>登出營運中心</button></div>
    <div class="brief-controls"><label>統計月份<input id="briefMonth" type="month" disabled></label><button id="readBrief" class="secondary" type="button" disabled>重新讀取</button><button id="downloadPptx" type="button" disabled>下載一頁簡報（PPTX）</button><button id="printBrief" class="secondary" type="button" disabled>列印／儲存PDF</button></div>
    <p id="briefStatus" role="status" aria-live="polite"></p><div id="briefPreview" class="preview-frame" hidden></div>
  </section>
</main>
<script src="portal-logout.js?v=20261012-brief-supervisor-1"></script>
